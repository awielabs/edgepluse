<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduPulse</title>
<style>
:root{--b:#1d4ed8;--bl:#eff6ff;--t:#0f172a;--g:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--t);background:#f8fafc;font-size:15px}
button,input,select{font:inherit}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:42px}
.btn.alt{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.red{background:var(--bad)}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;min-height:42px;background:#fff;max-width:100%}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 20px #0001;display:flex;flex-direction:column;gap:12px}
#app{display:none}.side{position:fixed;inset:0 auto 0 0;width:210px;background:var(--b);color:#fff;padding:16px 10px;overflow:auto}
.side h2{margin:4px 10px 16px}.side a{display:block;color:#dbeafe;padding:11px 12px;border-radius:8px;text-decoration:none;cursor:pointer}
.side a.on,.side a:hover{background:#ffffff26;color:#fff}.main{margin-left:210px;padding:20px 24px}
.top{display:none;background:var(--b);color:#fff;padding:10px 14px;align-items:center;justify-content:space-between}
h1{margin:0 0 14px;font-size:22px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat small{color:var(--g)}.stat b{display:block;font-size:28px;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{background:var(--bl);color:var(--b);font-size:13px}
.wrap{overflow-x:auto}.pill{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}
.sent,.Pass,.Excellent,.Good{background:#dcfce7;color:#166534}.pending,.Average{background:#fef3c7;color:#92400e}.failed,.Fail{background:#fee2e2;color:#991b1b}.not_configured{background:#e2e8f0;color:#475569}
.tog{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}.tog button{border:0;background:#fff;padding:9px 14px;cursor:pointer;min-height:40px}
.tog .P.on{background:var(--ok);color:#fff}.tog .A.on{background:var(--bad);color:#fff}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;color:#fff;display:none;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal>div{background:#fff;border-radius:14px;padding:20px;width:480px;max-width:100%;max-height:92vh;overflow:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;font-size:13px;color:var(--g);gap:4px}.form .full{grid-column:1/-1}
.att{padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer}.att.high{border-left:5px solid var(--bad)}.att.medium{border-left:5px solid var(--warn)}
.meter{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--b)}
.note{background:#fffbeb;border:1px solid #fde68a;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
@media(max-width:800px){.side{display:none;position:static;width:auto;inset:auto}.side.open{display:block;position:fixed;inset:44px 0 0 0;z-index:40}.main{margin:0;padding:14px}.top{display:flex}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login">
  <h2 style="margin:0;color:var(--b)">EduPulse</h2><small>Student monitoring &amp; parent alerts</small>
  <input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" onclick="login()">Log in</button><small id="lerr" style="color:var(--bad)"></small>
</div>
<div id="app">
  <div class="top"><b>EduPulse</b><button class="btn sm alt" onclick="document.querySelector('.side').classList.toggle('open')">Menu</button></div>
  <div class="side"><h2>EduPulse</h2><div id="nav"></div><a onclick="logout()">Log out</a></div>
  <div class="main" id="view"></div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
